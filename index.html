
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WHEEL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="title">
        <h1>THE WHEEL</h1>
        <p>FIND YOUR WAY TO THE CENTER</p>
    </div>

    <div id="generation">
        TOTAL SPINS: <span id="generationNumber">0</span>
    </div>

    <div id="speedText">
        SPEED: <span id="speedNumber">0</span>
    </div>

    <div id="world">
        <div
            id="wheel"
            class="wheel"
            role="img"
            aria-label="Interactive metallic car wheel. Hover to spin and click to launch it off screen."
            tabindex="0"
        >
            <div class="tire">
                <div class="rim">
                    <div id="spokes"></div>
                    <div class="hub"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
